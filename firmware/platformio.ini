; Firmware for the WiFi-Cam-Proxy (Wi-Fi otoscopes and microscopes -> Ethernet)
; Supported boards:
;   zb-gw03        ZB-GW03 v1.4 (ESP32 + LAN8720, internal 50 MHz clock on GPIO17)
;   wt32-eth01     WT32-ETH01   (ESP32 + LAN8720, external 50 MHz oscillator on GPIO0)
;   cyd            ESP32-2432S028R "Cheap Yellow Display" (display instead of Ethernet)
;   fnk0115        Freenove ESP32-S3 Display FNK0115, 800x480 IPS (display instead of Ethernet)
;
; pioarduino = community platform with Arduino core 3.x (ESP-IDF 5.x).
; The official PlatformIO platform stays on core 2.x.
; Version pinned (Arduino core 3.3.12, ESP-IDF 5.5.5) so a build in a year gives the
; same result. "stable" moves with new releases.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Custom ESP-IDF settings: pioarduino rebuilds the Arduino libraries with them (the
; first build takes long). The Arduino defaults are too tight for a video stream from
; Wi-Fi into the LAN:
custom_sdkconfig =
    CONFIG_BT_ENABLED=n
    CONFIG_LWIP_UDP_RECVMBOX_SIZE=32
; BT_ENABLED            off: Bluetooth is not used; saves IRAM (where the frame data
;                         lives) and RAM
; UDP_RECVMBOX_SIZE       6 -> 32: a whole frame (15-30 packets) fits into the UDP buffer
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=esp_panic_handler   ; enables set_arduino_panic_handler() (src/crashlog.cpp)
; Commit of the build (git describe) as GIT_REV, see git_rev.py; ccache if installed, see
; ccache.py (pioarduino rebuilds ESP-IDF when switching between ESP32 and ESP32-S3)
extra_scripts =
    pre:ccache.py
    post:git_rev.py
; Ethernet boards: do not build the CYD display file
build_src_filter = +<*> -<main_cyd.cpp>

; ============================================================================
; ZB-GW03 v1.4: Zigbee gateway with ESP32 + LAN8720
; First flash via USB-UART adapter (GPIO0 to GND at power-on)
; ============================================================================
[env:zb-gw03]
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_ZB_GW03

; All further updates over the LAN via HTTP (same interface as /update in the browser)
; With an OTA password: add -H "X-OTA-Password: ..."
[env:zb-gw03-http]
upload_protocol = custom
upload_command = curl -f --data-binary @$SOURCE -H "Content-Type: application/octet-stream" http://wifi-cam.local/update
build_flags =
    ${env.build_flags}
    -DBOARD_ZB_GW03

; ... or via espota (ArduinoOTA, UDP/TCP 3232)
[env:zb-gw03-ota]
upload_protocol = espota
upload_port = wifi-cam.local
build_flags =
    ${env.build_flags}
    -DBOARD_ZB_GW03
; upload_flags = --auth=<OTA_PASSWORD from config.h>

; ============================================================================
; WT32-ETH01: ESP32 board with LAN8720 and its own 50 MHz oscillator (GPIO0)
; Advantage: no 10 Mbit limit, 100 Mbit even with simultaneous Wi-Fi reception.
; First flash via USB-UART (GPIO0 to GND at power-on, as with the ZB-GW03)
; ============================================================================
[env:wt32-eth01]
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01

[env:wt32-eth01-http]
upload_protocol = custom
upload_command = curl -f --data-binary @$SOURCE -H "Content-Type: application/octet-stream" http://wifi-cam.local/update
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01

[env:wt32-eth01-ota]
upload_protocol = espota
upload_port = wifi-cam.local
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01

; ============================================================================
; CYD "Cheap Yellow Display" ESP32-2432S028R: ESP32 + 2.8" 320x240 + touch
; No Ethernet: shows the camera image directly on the display (src/main_cyd.cpp).
; Flash via USB (CH340 with auto-reset).
; LovyanGFX detects the display variant (ILI9341/ST7789) and touch by itself.
; ============================================================================
[env:cyd]
build_src_filter = +<*> -<main.cpp> -<network.cpp> -<http.cpp> -<rescue.cpp> -<sniffer.cpp>
lib_deps =
    lovyan03/LovyanGFX@1.2.31
    bitbank2/JPEGDEC@1.8.4
upload_speed = 921600
; The JPEG decoder is the limit here: our code and the libraries (JPEGDEC, LovyanGFX)
; for speed (-O2) instead of size (-Os). Flash at 80 MHz instead of 40 (still DIO):
; code and the decoder's tables run from flash through the cache. Lives in the
; bootloader, so it needs a flash over USB (the CYD's usual way) to take effect.
board_build.f_flash = 80000000L
board_build.flash_mode = dio
build_unflags = -Os
build_flags =
    ${env.build_flags}
    -O2
    -DBOARD_CYD

; ============================================================================
; Freenove ESP32-S3 Display FNK0115 with the 800x480 IPS panel (FNK0115Q 5.0",
; FNK0115L 4.3"): ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM), RGB panel,
; GT911 touch. Same display code as the CYD (src/main_cyd.cpp); panel, touch and backlight
; in include/lgfx_fnk0115.h. The schematic says N8R2, the board carries an N16R8: with the
; N8R2's quad PSRAM setting it found no PSRAM and crashed at start.
; The TN variants (XPT2046 touch, other timings) are not supported.
; Flash via USB (CH340 with auto-reset).
; ============================================================================
[env:fnk0115]
board = esp32-s3-devkitc1-n16r8
; Arduino's RESTART_IN_VSYNC restarts the panel's DMA every VSYNC; without bounce buffers
; that went through a link that always starts frame buffer 0 (ESP32-S3 workaround in
; esp_lcd_panel_rgb.c), and the picture jumped back to it every refresh. ESP-IDF's default
; (n) restarts only when the bounce buffers lost sync.
; Larger caches (48 KB of internal RAM): the decoder's code on two cores plus Wi-Fi in
; 16 KB of instruction cache, and 64-byte data cache lines for the frame buffers in the
; PSRAM (Espressif's advice for RGB panels).
custom_sdkconfig =
    ${env.custom_sdkconfig}
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
    CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
build_src_filter = ${env:cyd.build_src_filter}
lib_deps = ${env:cyd.lib_deps}
upload_speed = 921600
build_unflags = -Os
build_flags =
    ${env.build_flags}
    -O2
    -DBOARD_FNK0115
