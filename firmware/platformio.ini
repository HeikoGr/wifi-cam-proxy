; Firmware für den WiFi-Cam-Proxy (WLAN-Otoskope und -Mikroskope -> Ethernet)
; Unterstützte Boards:
;   zb-gw03        ZB-GW03 v1.4 (ESP32 + LAN8720, interner 50-MHz-Takt GPIO17)
;   wt32-eth01     WT32-ETH01   (ESP32 + LAN8720, externer 50-MHz-Quarz GPIO0)
;   cyd            ESP32-2432S028R "Cheap Yellow Display" (Display statt Ethernet)
;
; pioarduino = Community-Plattform mit Arduino-Core 3.x (ESP-IDF 5.x).
; Die offizielle PlatformIO-Plattform bleibt auf Core 2.x stehen.
; Version fest (Arduino-Core 3.3.12, ESP-IDF 5.5.5), damit ein Build in einem Jahr
; dasselbe Ergebnis liefert. "stable" wandert mit neuen Releases.

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Eigene ESP-IDF-Einstellungen: pioarduino baut die Arduino-Bibliotheken damit neu
; (erster Build dauert lange). Die Arduino-Voreinstellungen sind für einen Videostrom
; vom WLAN ins LAN zu knapp:
custom_sdkconfig =
    CONFIG_BT_ENABLED=n
    CONFIG_LWIP_UDP_RECVMBOX_SIZE=32
; BT_ENABLED            aus: Bluetooth wird nicht genutzt; spart IRAM (dort liegen die
;                         Bilddaten) und RAM
; UDP_RECVMBOX_SIZE       6 -> 32: ein ganzes Bild (15-30 Pakete) passt in den UDP-Puffer
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wl,--wrap=esp_panic_handler   ; aktiviert set_arduino_panic_handler() (src/crashlog.cpp)
; Ethernet-Boards: Display-Dateien des CYD nicht mitbauen
build_src_filter = +<*> -<main_cyd.cpp>

; ============================================================================
; ZB-GW03 v1.4: Zigbee-Gateway mit ESP32 + LAN8720
; Erstes Flashen per USB-UART-Adapter (GPIO0 beim Einschalten auf GND)
; ============================================================================
[env:zb-gw03]
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_ZB_GW03

; Alle weiteren Updates übers LAN, per HTTP (dieselbe Schnittstelle wie /update im Browser)
; Mit OTA-Passwort: -H "X-OTA-Password: ..." ergänzen
[env:zb-gw03-http]
upload_protocol = custom
upload_command = curl -f --data-binary @$SOURCE -H "Content-Type: application/octet-stream" http://otoskop.local/update
build_flags =
    ${env.build_flags}
    -DBOARD_ZB_GW03

; ... oder per espota (ArduinoOTA, UDP/TCP 3232)
[env:zb-gw03-ota]
upload_protocol = espota
upload_port = otoskop.local
build_flags =
    ${env.build_flags}
    -DBOARD_ZB_GW03
; upload_flags = --auth=<OTA_PASSWORD aus config.h>

; ============================================================================
; WT32-ETH01: ESP32-Board mit LAN8720 und eigenem 50-MHz-Quarz (GPIO0)
; Vorteil: Kein 10-Mbit-Limit, 100 Mbit auch bei gleichzeitigem WLAN-Empfang.
; Erstes Flashen per USB-UART (GPIO0 beim Einschalten auf GND, wie beim ZB-GW03)
; ============================================================================
[env:wt32-eth01]
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01

[env:wt32-eth01-http]
upload_protocol = custom
upload_command = curl -f --data-binary @$SOURCE -H "Content-Type: application/octet-stream" http://otoskop.local/update
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01

[env:wt32-eth01-ota]
upload_protocol = espota
upload_port = otoskop.local
build_flags =
    ${env.build_flags}
    -DBOARD_WT32_ETH01

; ============================================================================
; CYD "Cheap Yellow Display" ESP32-2432S028R: ESP32 + 2,8" 320x240 + Touch
; Kein Ethernet: zeigt das Kamerabild direkt auf dem Display (src/main_cyd.cpp).
; Flashen per USB (CH340 mit Auto-Reset).
; Display-Variante (ILI9341/ST7789) und Touch erkennt LovyanGFX selbst.
; ============================================================================
[env:cyd]
build_src_filter = +<*> -<main.cpp> -<rescue.cpp>
lib_deps =
    lovyan03/LovyanGFX@1.2.31
    bitbank2/JPEGDEC@1.8.4
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DBOARD_CYD
